# DustAhead default configuration. Every script reads this file.

domain:                 # Arizona + New Mexico, ~4 km cells, 250 x 200
  lon_min: -115.0
  lon_max: -103.0
  lat_min: 30.5
  lat_max: 36.5
  nx: 250
  ny: 200

time:
  step_min: 10          # GOES CONUS scan cadence we sample at
  history_frames: 6     # t0-50 ... t0 (6 frames x 10 min)
  leads_min: [15, 30, 60]
  hours_before: 3       # sample window starts 3 h before the first warning (genesis cases)
  hours_after: 2        # ... and ends 2 h after the last warning expires
  samples_per_event: 72 # cap (12 h at 10 min)

satellite:              # GOES-East ABI Cloud and Moisture Imagery, CONUS (covers all of AZ+NM; West cuts off east NM)
  bucket: null          # null = pick by date: noaa-goes16 before 2025-04-07, noaa-goes19 after
  product: ABI-L2-MCMIPC
  bands: [2, 7, 11, 13, 14, 15]   # 0.64, 3.9, 8.4, 10.3, 11.2, 12.3 um
  dust_product: ABI-L2-ADPC       # Aerosol Detection Product (weak pixel labels)

lightning:
  bucket: null          # same satellite as the imagery
  product: GLM-L2-LCFA
  window_min: 10

hrrr:
  fields: [u10, v10, gust, cape, rh2m, soilm, apcp]

label:
  vis_max_mi: 1.0
  severe_vis_mi: 0.25
  dust_codes: [DU, BLDU, DS, SS, HZ, VCBLDU, DRDU, SA, BLSA]   # a dust code is REQUIRED
  rain_codes: [RA, DZ, SN, SHRA, TSRA, GR, GS, PL]              # recorded as rain_too, never excludes
  warning_pad_min: 60    # report counts if within ±60 min of a DS warning or Storm Events entry
  asos_report_types: [1, 2, 3]   # 5-minute, routine hourly, specials
  station_radius_km: 12  # pixels within this radius of a labelled station share its label
  genesis_radius_km: 50  # "genesis" case = no dust within 50 km at t0

splits:
  train: [2018, 2019, 2020, 2021, 2022, 2023, 2024]   # 2018-22 from GOES-16 (East), same sector; no ADP before 2020
  val: [2025]
  test: [2026]          # frozen: evaluated once at the end
  val_from_2025: 0.5    # fraction of 2025 EVENTS (by hash) kept for validation; the rest join training.
                        # 2023-24 alone hold only ~180 positive station labels; 2025 holds ~950.

channels:
  satellite: 36          # 6 frames x 6 bands
  lightning: 6           # 6 frames of flash density
  ir_change: 5           # 10.3 um frame differences
  hrrr: 8                # u, v, gust, cape, dcape, rh, soil moisture, 7-day rain
  static: 6              # elevation, slope, bare/fallow, land cover class, sand, clay
  physics: 1             # erodibility prior
  total: 62

model:
  name: gated_unet
  base_channels: 32
  depth: 4
  gate_bias_init: 2.2    # sigmoid(2.2) ~ 0.90: gate starts open
  gate_channels: [hrrr, static, physics]

train:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 8
  epochs: 50
  patience: 8
  crop: [160, 192]       # (ny, nx) random crops; no flips (terrain is not symmetric)
  amp: true
  num_workers: 4
  val_max_samples: 1200   # validation subset per epoch: every sample with a positive + evenly spaced negatives
  pos_oversample: 5       # WeightedRandomSampler weight for samples that contain any positive
  station_dropout: 0.0    # training-only: fraction of current station reports hidden per sample (v7 uses 0.3)
  seed: 42

loss:
  focal_alpha: 0.75       # weight on the (rare) positive class; 0.25 let the model collapse to "never dust"
  focal_gamma: 2.0
  fss_window: 5
  w_focal: 1.0
  w_fss: 1.0
  w_station: 3.0          # stations are the only true ground truth
  station_pos_weight: 10.0
  station_genesis_weight: 0.0   # extra x(1+w) on positives at genesis stations (no dust within 50 km at t0); v5 runs use 3

eval:
  threshold: 0.5
  bootstrap: 1000
  fss_windows: [3, 5, 9]

product:                 # alert policy for the prototype (validated on the 2025 event split, see results/)
  checkpoints: [runs/unet_all_v4/best.pt, runs/gated_unet_v4/best.pt, runs/gated_unet_v8/best.pt]   # element-wise max; v8 adds monsoon coverage
  thresholds: [0.80, 0.80, 0.80]          # per lead (+15, +30, +60): best-CSI thresholds of the max ensemble
  genesis_thresholds: [0.80, 0.80, 0.80]  # road cells with no dust-reporting station within 50 km (same for now)
  severe_margin: 0.10                     # "severe" when P exceeds the threshold by this much
  release_threshold: 0.50                 # an active alert is released only when P falls below this ...
  min_hold_steps: 3                       # ... and never before 3 forecasts (30 min) have passed

paths:
  data_root: data
  raw: data/raw          # only Storm Events gz files land here; GOES/GLM/HRRR are read remotely
  cache: data/cache      # regridded GOES frames, GLM densities, HRRR fields (small, reusable)
  samples: data/samples
  labels: data/labels
  static: data/static
  runs: runs
